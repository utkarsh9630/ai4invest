{% extends "base.html" %}
{% block content %}
  <div class="max-w-3xl mx-auto py-8 px-4">
    <h1 class="text-3xl font-bold mb-6 text-white text-center">Financial Risk Profiling</h1>
    
    <div class="bg-white rounded-lg shadow-lg p-6">
      <form method="post" action="{{ url_for('predict') }}" id="riskForm">
        <input type="hidden" name="client_time" id="client_time"/>

        <!-- Progress Bar -->
        <div class="mb-8">
          <div class="flex justify-between mb-2">
            <span class="text-sm font-medium text-gray-700">Step <span id="currentStep">1</span> of 5</span>
            <span class="text-sm font-medium text-gray-700"><span id="progressPercent">20</span>%</span>
          </div>
          <div class="w-full bg-gray-200 rounded-full h-2.5">
            <div id="progressBar" class="bg-green-600 h-2.5 rounded-full transition-all duration-300" style="width: 20%"></div>
          </div>
        </div>

        <!-- Page 1: Profile Name & Demographics -->
        <div class="form-page active" data-page="1">
          <h2 class="text-xl font-semibold mb-4 text-gray-800">Basic Information</h2>
          
          <div class="mb-4">
            <label class="block font-medium mb-2">Profile Name</label>
            <input type="text" name="profile_name" placeholder="e.g. My Retirement Plan" class="w-full border rounded p-2" required/>
          </div>

          <div class="mb-4">
            <label class="block font-medium mb-2">Age Group</label>
            <select name="Age Group" required class="w-full border rounded p-2">
              <option value="">— Select —</option>
              {% for val, lbl in field_options['Age Group'] %}
                <option value="{{ val }}">{{ lbl }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-4">
            <label class="block font-medium mb-2">Ethnicity</label>
            <select name="Ethnicity" required class="w-full border rounded p-2">
              <option value="">— Select —</option>
              {% for val, lbl in field_options['Ethnicity'] %}
                <option value="{{ val }}">{{ lbl }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-4">
            <label class="block font-medium mb-2">Education Level</label>
            <select name="Education Level" required class="w-full border rounded p-2">
              <option value="">— Select —</option>
              {% for val, lbl in field_options['Education Level'] %}
                <option value="{{ val }}">{{ lbl }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-4">
            <label class="block font-medium mb-2">Marital Status</label>
            <select name="Marital Status" required class="w-full border rounded p-2">
              <option value="">— Select —</option>
              {% for val, lbl in field_options['Marital Status'] %}
                <option value="{{ val }}">{{ lbl }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <!-- Page 2: Financial Situation -->
        <div class="form-page" data-page="2">
          <h2 class="text-xl font-semibold mb-4 text-gray-800">Financial Situation</h2>
          
          <div class="mb-4">
            <label class="block font-medium mb-2">Financially Dependent Children</label>
            <input type="number" name="Financially dependent children" min="0" required class="w-full border rounded p-2"/>
          </div>

          <div class="mb-4">
            <label class="block font-medium mb-2">Annual Household Income ($)</label>
            <input type="number" name="Annual Household Income" min="0" required class="w-full border rounded p-2"/>
          </div>

          <div class="mb-4">
            <label class="block font-medium mb-2">Spending vs Income Past Year</label>
            <select name="Spending vs Income Past Year" required class="w-full border rounded p-2">
              <option value="">— Select —</option>
              {% for val, lbl in field_options['Spending vs Income Past Year'] %}
                <option value="{{ val }}">{{ lbl }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-4">
            <label class="block font-medium mb-2">Difficulty Covering Expenses</label>
            <select name="Difficulty covering expenses" required class="w-full border rounded p-2">
              <option value="">— Select —</option>
              {% for val, lbl in field_options['Difficulty covering expenses'] %}
                <option value="{{ val }}">{{ lbl }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-4">
            <label class="block font-medium mb-2">Emergency Fund to Cover 3 Months Expenses</label>
            <select name="Emergency fund to cover 3 Months expenses" required class="w-full border rounded p-2">
              <option value="">— Select —</option>
              {% for val, lbl in field_options['Emergency fund to cover 3 Months expenses'] %}
                <option value="{{ val }}">{{ lbl }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <!-- Page 3: Financial Satisfaction & Planning -->
        <div class="form-page" data-page="3">
          <h2 class="text-xl font-semibold mb-4 text-gray-800">Financial Outlook</h2>
          
          <div class="mb-4">
            <label class="block font-medium mb-2">Current Financial Condition Satisfaction</label>
            <select name="Current financial condition satisfaction" required class="w-full border rounded p-2">
              <option value="">— Select —</option>
              {% for val, lbl in field_options['Current financial condition satisfaction'] %}
                <option value="{{ val }}">{{ lbl }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-4">
            <label class="block font-medium mb-2">Thinking About Financial Condition Frequency</label>
            <select name="Thinking about FC frequency" required class="w-full border rounded p-2">
              <option value="">— Select —</option>
              {% for val, lbl in field_options['Thinking about FC frequency'] %}
                <option value="{{ val }}">{{ lbl }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-4">
            <label class="block font-medium mb-2">Account Ownership (Checking/Savings - # of accounts)</label>
            <input type="number" name="Account ownership check" min="0" required class="w-full border rounded p-2"/>
          </div>

          <div class="mb-4">
            <label class="block font-medium mb-2">Savings/Money Market/CD Accounts (# of accounts)</label>
            <input type="number" name="Savings/Money market/CD account ownership" min="0" required class="w-full border rounded p-2"/>
          </div>
        </div>

        <!-- Page 4: Investments & Retirement -->
        <div class="form-page" data-page="4">
          <h2 class="text-xl font-semibold mb-4 text-gray-800">Investments & Retirement</h2>
          
          <div class="mb-4">
            <label class="block font-medium mb-2">Employer-Sponsored Retirement Plans (# of accounts)</label>
            <input type="number" name="Employer-sponsored retirement plan ownership" min="0" required class="w-full border rounded p-2"/>
          </div>

          <div class="mb-4">
            <label class="block font-medium mb-2">Homeownership</label>
            <select name="Homeownership" required class="w-full border rounded p-2">
              <option value="">— Select —</option>
              {% for val, lbl in field_options['Homeownership'] %}
                <option value="{{ val }}">{{ lbl }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-4">
            <label class="block font-medium mb-2">Regular Contribution to Retirement Account</label>
            <select name="Regular contribution to a retirement account" required class="w-full border rounded p-2">
              <option value="">— Select —</option>
              {% for val, lbl in field_options['Regular contribution to a retirement account'] %}
                <option value="{{ val }}">{{ lbl }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-4">
            <label class="block font-medium mb-2">Non-Retirement Investments (Stocks, Bonds, Mutual Funds)</label>
            <select name="Non-retirement investments in stocks, bonds, mutual funds" required class="w-full border rounded p-2">
              <option value="">— Select —</option>
              {% for val, lbl in field_options['Non-retirement investments in stocks, bonds, mutual funds'] %}
                <option value="{{ val }}">{{ lbl }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <!-- Page 5: Self-Assessment -->
        <div class="form-page" data-page="5">
          <h2 class="text-xl font-semibold mb-4 text-gray-800">Self-Assessment</h2>
          
          <div class="mb-4">
            <label class="block font-medium mb-2">Self-Efficacy (1-5, where 5 is highest confidence)</label>
            <select name="Self-efficacy" required class="w-full border rounded p-2">
              <option value="">— Select —</option>
              {% for val, lbl in field_options['Self-efficacy'] %}
                <option value="{{ val }}">{{ lbl }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-4">
            <label class="block font-medium mb-2">Self-Rated Overall Financial Knowledge (1-5, where 5 is highest)</label>
            <select name="Self-rated overall financial knowledge" required class="w-full border rounded p-2">
              <option value="">— Select —</option>
              {% for val, lbl in field_options['Self-rated overall financial knowledge'] %}
                <option value="{{ val }}">{{ lbl }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <!-- Navigation Buttons -->
        <div class="flex justify-between mt-6">
          <button type="button" id="prevBtn" class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-2 rounded" style="display:none;">Previous</button>
          <button type="button" id="nextBtn" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded ml-auto">Next</button>
          <button type="submit" id="submitBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded ml-auto" style="display:none;">Submit Profile</button>
        </div>
      </form>
    </div>
  </div>

  <style>
    .form-page {
      display: none;
    }
    .form-page.active {
      display: block;
    }
  </style>

  <script>
    let currentPage = 1;
    const totalPages = 5;

    // Set client time
    document.addEventListener("DOMContentLoaded", () => {
      const now = new Date();
      const pad = n => String(n).padStart(2, "0");
      const ts = now.getFullYear() + "-" + pad(now.getMonth()+1) + "-" + pad(now.getDate()) + " " + pad(now.getHours()) + ":" + pad(now.getMinutes());
      document.getElementById("client_time").value = ts;
    });

    function showPage(page) {
      document.querySelectorAll('.form-page').forEach(p => p.classList.remove('active'));
      document.querySelector(`.form-page[data-page="${page}"]`).classList.add('active');
      
      // Update progress
      const percent = (page / totalPages) * 100;
      document.getElementById('progressBar').style.width = percent + '%';
      document.getElementById('currentStep').textContent = page;
      document.getElementById('progressPercent').textContent = Math.round(percent);
      
      // Update buttons
      document.getElementById('prevBtn').style.display = page === 1 ? 'none' : 'inline-block';
      document.getElementById('nextBtn').style.display = page === totalPages ? 'none' : 'inline-block';
      document.getElementById('submitBtn').style.display = page === totalPages ? 'inline-block' : 'none';
    }

    function validatePage(page) {
      const pageDiv = document.querySelector(`.form-page[data-page="${page}"]`);
      const inputs = pageDiv.querySelectorAll('input[required], select[required]');
      
      for (let input of inputs) {
        if (!input.value) {
          input.focus();
          alert('Please fill in all required fields before proceeding.');
          return false;
        }
      }
      return true;
    }

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (validatePage(currentPage)) {
        currentPage++;
        showPage(currentPage);
      }
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      currentPage--;
      showPage(currentPage);
    });

    showPage(currentPage);
  </script>
{% endblock %}
